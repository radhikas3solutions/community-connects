name: Deploy API

# Deploys the API to Fly.io after CI passes on main. Skipped until the repository has a
# FLY_API_TOKEN secret (Settings -> Secrets and variables -> Actions); see docs/DEPLOY.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check for the Fly token
        id: token
        run: echo "present=${{ env.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.present == 'true'
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        working-directory: backend
        run: flyctl deploy --remote-only
