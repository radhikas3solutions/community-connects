# Fly.io config for the API. Change `app` if the name is taken (fly apps create <name>).
# Secrets (DATABASE_URL, SUPABASE_*, ANTHROPIC_API_KEY, CORS_ORIGINS) are set with
# `fly secrets set`, never here. See docs/DEPLOY.md.
app = "askmitra-api"
primary_region = "iad" # Ashburn, VA: next to the users and Supabase us-east-1

[build]
  dockerfile = "Dockerfile"
  [build.args]
    INSTALL_DEV = "false"

[deploy]
  # Runs once per deploy, before new machines start.
  release_command = "alembic upgrade head"

[env]
  ENVIRONMENT = "production"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
