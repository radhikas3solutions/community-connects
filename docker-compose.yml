services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-community_connect}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cc}:${POSTGRES_PASSWORD:-cc_dev_password}@db:5432/${POSTGRES_DB:-community_connect}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cc}:${POSTGRES_PASSWORD:-cc_dev_password}@db:5432/community_connect_test
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./frontend
      target: dev
    env_file: .env
    depends_on: [api]
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "/app/node_modules", "/app/.next"]

volumes:
  pgdata:
